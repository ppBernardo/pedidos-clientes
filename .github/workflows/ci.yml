name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hooks:
    name: Hooks do Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Testes dos hooks
        run: node --test ".claude/hooks/**/*.test.mjs"

  backend:
    name: Backend (build, testes unitários e de integração)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build (warnings são erros)
        run: dotnet build backend/Pedidos.slnx -c Release
      - name: Testes unitários
        run: dotnet test --project backend/tests/Pedidos.UnitTests -c Release --no-build
      # O runner ubuntu-latest já tem Docker: o Testcontainers sobe o SQL Server
      # e roda os mesmos scripts de database/ que o docker compose.
      - name: Testes de integração (SQL Server real via Testcontainers)
        run: dotnet test --project backend/tests/Pedidos.IntegrationTests -c Release --no-build

  frontend:
    name: Frontend (lint, typecheck e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck e build
        run: npm run build

  # Prova o requisito "sobe com um único comando" numa máquina limpa: sem .env,
  # sem passo manual. Depois faz um fluxo real pelo proxy do frontend.
  compose:
    name: Docker compose (smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: docker compose up
        run: docker compose up -d --build
      - name: Espera a API responder pelo proxy do frontend
        run: |
          for tentativa in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/api/health; then
              echo "Aplicação no ar."
              exit 0
            fi
            sleep 5
          done
          echo "A aplicação não subiu a tempo."
          exit 1
      - name: Fluxo de ponta a ponta (listar, criar, seguir o Location, ver no topo, relatório)
        run: |
          set -euo pipefail
          base=http://localhost:3000
          curl -fsS -o /dev/null "$base/"
          test "$(curl -fsS "$base/api/pedidos?tamanhoPagina=1" | jq '.totalItens')" -eq 1500
          criado=$(curl -fsS -D criado.txt -X POST "$base/api/pedidos" -H 'Content-Type: application/json' \
            -d '{"clienteId": 1, "itens": [{"produtoId": 3, "quantidade": 1}]}')
          id=$(echo "$criado" | jq '.id')
          # Pelo proxy, o Location precisa voltar com o prefixo /api e levar ao mesmo pedido.
          location=$(grep -i '^location:' criado.txt | cut -d' ' -f2 | tr -d '\r')
          test "$location" = "/api/pedidos/$id"
          curl -fsS "$base$location" | jq -e ".id == $id"
          curl -fsS "$base/api/pedidos?tamanhoPagina=1" | jq -e ".itens[0].id == $id"
          curl -fsS "$base/api/relatorios/top-clientes?dataInicio=2026-01-01&dataFim=2026-12-31" | jq -e 'length == 5'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/pedidos" \
            -H 'Content-Type: application/json' -d '{"clienteId": 1, "itens": [{"produtoId": 24, "quantidade": 1}]}')
          test "$status" -eq 422
      - name: Logs dos containers
        if: failure()
        run: docker compose ps --all && docker compose logs
      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v

  # O MCP que o Claude Code usa (DBHub via HTTP, profile dev): handshake MCP,
  # ferramentas, uma leitura e a prova de que escrita não passa.
  mcp:
    name: MCP do SQL Server (smoke test)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - name: Sobe banco e DBHub
        run: docker compose --profile dev up -d sqlserver db-init mcp-sqlserver
      - name: Espera o DBHub
        run: |
          for tentativa in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8090/healthz; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Conversa MCP (initialize, tools/list, execute_sql)
        run: |
          set -euo pipefail
          url=http://127.0.0.1:8090/mcp
          cabecalhos=(-H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream')
          curl -sS -D sessao.txt "${cabecalhos[@]}" "$url" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
          echo
          id_sessao=$(grep -i '^mcp-session-id:' sessao.txt | cut -d' ' -f2 | tr -d '\r' || true)
          if [ -n "$id_sessao" ]; then cabecalhos+=(-H "Mcp-Session-Id: $id_sessao"); fi
          mcp() { curl -sS "${cabecalhos[@]}" "$url" -d "$1"; echo; }
          mcp '{"jsonrpc":"2.0","method":"notifications/initialized"}'
          mcp '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | tee ferramentas.txt
          grep -q execute_sql ferramentas.txt
          mcp '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"execute_sql","arguments":{"sql":"SELECT COUNT(*) AS pedidos FROM dbo.Pedidos"}}}' | tee leitura.txt
          grep -q 1500 leitura.txt
          echo "--- tentativa de escrita (deve ser recusada):"
          mcp '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"execute_sql","arguments":{"sql":"DELETE FROM dbo.ItensPedido"}}}'
          mcp '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"execute_sql","arguments":{"sql":"SELECT COUNT(*) AS itens FROM dbo.ItensPedido"}}}' | tee depois.txt
          test "$(docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Pedidos2026Sa -C -h -1 -d PedidosDb -Q 'SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.ItensPedido' | tr -d ' \r')" -gt 0
          echo "--- explain_sql (informativo):"
          mcp '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"explain_sql","arguments":{"sql":"SELECT COUNT(*) FROM dbo.Pedidos WHERE DataPedido >= '"'"'2026-01-01'"'"'"}}}' || true
      - name: Logs dos containers
        if: failure()
        run: docker compose --profile dev logs
      - name: Derruba o ambiente
        if: always()
        run: docker compose --profile dev down -v
