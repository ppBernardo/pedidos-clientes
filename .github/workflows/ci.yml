name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hooks:
    name: Hooks do Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Testes dos hooks
        run: node --test ".claude/hooks/**/*.test.mjs"

  backend:
    name: Backend (build e testes unitários)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build (warnings são erros)
        run: dotnet build backend/Pedidos.slnx -c Release
      - name: Testes unitários
        run: dotnet test --project backend/tests/Pedidos.UnitTests -c Release --no-build

  frontend:
    name: Frontend (lint, typecheck e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck e build
        run: npm run build
