name: Parte 4 (medição da query de ranking)

# Roda o cenário de erros e a medição de performance da Parte 4 num runner
# com Docker, e imprime no log as leituras lógicas, os tempos e os operadores
# dos planos reais. Os .sqlplan ficam como artefato da execução.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "database/**"
      - ".github/workflows/parte4.yml"

permissions:
  contents: read

jobs:
  medir:
    name: Cenário de erros e medição (4 estados)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Banco com a carga de exemplo (db-init)
        run: docker compose run --rm db-init

      - name: Cenário de erros (original x corrigida, termina em ROLLBACK)
        run: |
          docker compose run --rm --entrypoint bash db-init -c \
            '/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$SA_PASSWORD" -C -b -f 65001 -W -s " | " \
               -d PedidosDb -v CONSULTAS=/database/consultas -i /database/consultas/cenario-erros.sql'

      - name: Medição com volume (PedidosPerf)
        run: |
          mkdir -p docs/parte4
          docker compose run --rm --user root -v "$PWD/docs/parte4:/saida" --entrypoint bash db-init /database/perf/run-perf.sh

      # Resumo em Markdown na página da execução (o log da interface trunca
      # saídas longas): leituras lógicas, tempos e os operadores de cada plano.
      - name: Resumo da medição e dos planos reais
        run: |
          python3 - <<'PY'
          import glob, os, re
          import xml.etree.ElementTree as ET

          ns = {"p": "http://schemas.microsoft.com/sqlserver/2004/07/showplan"}
          linhas = ["## Parte 4: medição em cache quente", "",
                    "| Estado | Leituras lógicas por tabela | CPU | Tempo |", "|---|---|---|---|"]
          for arquivo in sorted(glob.glob("docs/parte4/[1-4]-*.txt")):
              texto = open(arquivo, encoding="utf-8", errors="replace").read()
              leituras = [(t, int(r)) for t, r in re.findall(r"Table '(\w+)'\. Scan count \d+, logical reads (\d+)", texto)
                          if t != "Worktable"]
              cpu, tempo = (re.findall(r"CPU time = (\d+) ms,\s+elapsed time = (\d+) ms", texto) or [("?", "?")])[-1]
              detalhe = ", ".join(f"{t} {r}" for t, r in leituras)
              total = sum(r for _, r in leituras)
              linhas.append(f"| {os.path.basename(arquivo)[:-4]} | {detalhe} (**total {total}**) | {cpu} ms | {tempo} ms |")

          linhas += ["", "### Operadores dos planos reais (sem Compute Scalar, Segment e Parallelism)", ""]
          ignorados = {"Compute Scalar", "Segment", "Sequence Project", "Parallelism"}
          for plano in sorted(glob.glob("docs/parte4/*.sqlplan")):
              linhas.append(f"**{os.path.basename(plano)}**")
              linhas.append("")
              for op in ET.parse(plano).getroot().iter(f"{{{ns['p']}}}RelOp"):
                  if op.get("PhysicalOp") in ignorados:
                      continue
                  objeto = op.find("./*/p:Object", ns)
                  nome = f" `{objeto.get('Table')}.{objeto.get('Index')}`" if objeto is not None else ""
                  reais = sum(int(c.get("ActualRows", 0))
                              for c in op.findall("p:RunTimeInformation/p:RunTimeCountersPerThread", ns))
                  linhas.append(f"- {op.get('PhysicalOp')} ({op.get('LogicalOp')}){nome}: "
                                f"estimadas {float(op.get('EstimateRows')):.0f}, reais {reais}")
              linhas.append("")

          relatorio = "\n".join(linhas)
          print(relatorio)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as saida:
              saida.write(relatorio + "\n")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: parte4-planos-e-estatisticas
          path: docs/parte4/

      # O MCP do Claude Code (DBHub, login mcp_leitura) conecta no PedidosDb e lê o
      # banco da medição com nomes de três partes: a contagem e o Query Store.
      - name: MCP lendo o banco da medição (PedidosPerf)
        run: |
          set -euo pipefail
          docker compose --profile dev up -d mcp-sqlserver
          for tentativa in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8090/healthz; then break; fi
            if [ "$tentativa" -eq 60 ]; then echo "O DBHub não subiu a tempo."; exit 1; fi
            sleep 3
          done
          url=http://127.0.0.1:8090/mcp
          cabecalhos=(-H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream')
          curl -sS -o /dev/null -D sessao.txt "${cabecalhos[@]}" "$url" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
          id_sessao=$(grep -i '^mcp-session-id:' sessao.txt | cut -d' ' -f2 | tr -d '\r' || true)
          if [ -n "$id_sessao" ]; then cabecalhos+=(-H "Mcp-Session-Id: $id_sessao"); fi
          mcp() { curl -sS "${cabecalhos[@]}" "$url" -d "$1"; echo; }
          execute_sql() {
            jq -cn --arg sql "$2" --argjson id "$1" \
              '{jsonrpc: "2.0", id: $id, method: "tools/call", params: {name: "execute_sql", arguments: {sql: $sql}}}'
          }
          mcp '{"jsonrpc":"2.0","method":"notifications/initialized"}' > /dev/null
          mcp "$(execute_sql 2 'SELECT COUNT(*) AS pedidos FROM PedidosPerf.dbo.Pedidos')" | tee contagem.txt
          grep -q 400000 contagem.txt
          mcp "$(execute_sql 3 "SELECT TOP (6) rs.count_executions AS execucoes,
                 CAST(rs.avg_logical_io_reads AS BIGINT) AS leituras_media,
                 CAST(rs.avg_cpu_time / 1000.0 AS DECIMAL(12, 2)) AS cpu_ms_media,
                 LEFT(qt.query_sql_text, 90) AS consulta
               FROM PedidosPerf.sys.query_store_query_text AS qt
               JOIN PedidosPerf.sys.query_store_query AS q ON q.query_text_id = qt.query_text_id
               JOIN PedidosPerf.sys.query_store_plan AS p ON p.query_id = q.query_id
               JOIN PedidosPerf.sys.query_store_runtime_stats AS rs ON rs.plan_id = p.plan_id
               WHERE qt.query_sql_text LIKE N'%GROUP BY%'
               ORDER BY rs.avg_logical_io_reads DESC")" | tee query-store.txt
          {
            echo "### MCP (DBHub, login mcp_leitura) lendo o PedidosPerf"
            echo
            echo '```'
            cat contagem.txt query-store.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs do DBHub
        if: failure()
        run: docker compose --profile dev logs mcp-sqlserver

      - name: Derruba o ambiente
        if: always()
        run: docker compose --profile dev down -v
