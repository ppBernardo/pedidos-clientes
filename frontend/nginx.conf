server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: remove o prefixo /api e repassa para o backend. Mesma origem, sem CORS.
    location /api/ {
        proxy_pass http://backend:8080/;
        # O 201 do POST /pedidos traz Location relativo (/pedidos/{id}). Sem a
        # segunda regra, quem segue o header pela porta 3000 cai na SPA.
        proxy_redirect default;
        proxy_redirect / /api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer outra rota volta para o index.html, que nunca fica em cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
